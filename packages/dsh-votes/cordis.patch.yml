# dsh-votes bundle: redhaven voting for a dsh agent.
#
# The agent is an ordinary gate-token holder. Voting eligibility is the same
# rule that lets it post, proven the same way: a Haven-AOL membership receipt
# (one canister attestation per gate per 30-day epoch), verified offline by
# every peer. Nothing here touches the chain: votes are off-chain
# HAVEN_VOTE_V3 envelopes gossiped between redhaven peers.
#
# Needs (mounted by their own bundles, never restated here):
#   - dsh-wallet            custody root (`wallets.agent`)
#   - dsh-wallet-ethereum   with `provider: raw` so ctx.wallet.signDigest exists
#                           (the AttestRequest and the HavenVoteSession are
#                           signed raw; each once per gate per epoch)
# Optional:
#   - dsh-board             lets tools take a board slug instead of a gate spec,
#                           powers vote_ranked (board index + tallies), and
#                           shares its receipt so the agent mints once per gate
#
# This layer inserts ONLY its own row.
#   dsh plugin --profile <name> add /path/to/redhaven/packages/dsh-votes
- insert:
    - id: votes
      name: 'dsh-votes'
      config:
        wallet: agent
        storePath: /data/votes            # registers, sessions (0600), receipts
        canisterId: gny6k-fqaaa-aaaab-ag3ra-cai
        icpHost: https://icp-api.io
        fetchRootKey: false
        # attestPublicKey: <64 hex>       # pin the canister's Ed25519 attestation key; unset = one query per process
        eip712ChainId: 1                  # HavenAOL EIP-712 domain, as in dsh-haven-aol
        eip712VerifyingContract: '0x0000000000000000000000000000000000000000'
        # nostrRelays: [wss://relay.damus.io, wss://nos.lol]   # default: Trystero's list
        # turn: { urls: [turn:host:3478], username: u, credential: p }
        watch: []                         # gate specs to stay joined to from start (always-on peer)
        maxRooms: 8                       # most subreddit rooms held open at once
        idleLeaveS: 1800                  # leave an unwatched room after this much inactivity
